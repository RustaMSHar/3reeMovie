version: '3.8'

services:
  app:
    container_name: 3reeMovie
    build: .
    restart: always
    ports:
      - "8099:8099"

  nginx:
    image: nginx:latest
    container_name: 3reeMovie-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - app
